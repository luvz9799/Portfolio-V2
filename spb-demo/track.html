<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="demo/mock.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track My Requirement — Akshardham Associates</title>
  <link rel="icon" type="image/png" href="static/favicon.png">
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="static/vendor/fa/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="static/vendor/tw.css">
</head>
<body class="font-body bg-[#FBF6EF] text-slate-800 min-h-screen">
  <header class="bg-white/80 backdrop-blur border-b border-brand-100 sticky top-0 z-10">
    <div class="max-w-3xl mx-auto px-4 h-16 flex items-center gap-2.5">
      <a href="/" class="flex items-center gap-2.5"><img src="static/logo-icon.png" class="w-9 h-9 object-contain" alt="">
        <span class="font-head font-extrabold text-brand-900">Akshardham Associates</span></a>
      <a href="/" class="ml-auto text-sm text-brand-600 font-semibold"><i class="fas fa-arrow-left mr-1"></i>Home</a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-8">
    <h1 class="font-head text-2xl sm:text-3xl font-bold text-brand-900"><i class="fas fa-magnifying-glass-location text-brand-500 mr-2"></i>Track My Requirement</h1>
    <p class="text-slate-500 mt-1 mb-6 text-sm">Enter the mobile number and reference number (e.g. <b>#REQ-12</b>) you got when you submitted your requirement.</p>

    <form id="form-track" class="bg-white rounded-3xl shadow-sm border border-brand-100 p-5 sm:p-6 grid sm:grid-cols-[1fr_1fr_auto] gap-4 items-end">
      <label class="block"><span class="text-sm font-semibold text-slate-600">Mobile Number</span>
        <input name="mobile" inputmode="numeric" maxlength="10" required placeholder="10-digit number" class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-2.5 focus:border-brand-400 focus:outline-none"></label>
      <label class="block"><span class="text-sm font-semibold text-slate-600">Reference No.</span>
        <input name="ref" inputmode="numeric" required placeholder="e.g. 12" class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-2.5 focus:border-brand-400 focus:outline-none"></label>
      <button class="bg-gradient-to-r from-brand-600 to-brand-500 text-white font-bold px-6 py-2.5 rounded-xl shadow"><i class="fas fa-search mr-1"></i>Track</button>
    </form>

    <div id="result" class="mt-6"></div>
  </main>

  <script>
    const $ = s => document.querySelector(s)
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]))
    const STEPS = [['new','Received'],['contacted','Contacted'],['matched','Options Sent'],['closed','Closed']]

    function statusTracker(status) {
      const idx = STEPS.findIndex(s => s[0] === status)
      return `<div class="flex items-center">${STEPS.map(([k,label],i) => `
        <div class="flex flex-col items-center flex-1">
          <div class="w-9 h-9 rounded-full grid place-items-center text-sm ${i<=idx?'bg-brand-500 text-white':'bg-slate-200 text-slate-400'}">
            ${i<idx?'<i class="fas fa-check"></i>':i===idx?'<i class="fas fa-circle-dot"></i>':(i+1)}
          </div>
          <span class="text-[11px] mt-1 text-center ${i<=idx?'text-brand-700 font-semibold':'text-slate-400'}">${label}</span>
        </div>
        ${i<STEPS.length-1?`<div class="h-0.5 flex-1 ${i<idx?'bg-brand-400':'bg-slate-200'} -mt-4"></div>`:''}`).join('')}</div>`
    }

    function matchCard(s) {
      const photo = (s.photos && s.photos[0]) ? (typeof s.photos[0]==='string'?s.photos[0]:s.photos[0].url) : null
      return `<div class="flex gap-3 bg-white rounded-2xl border border-brand-100 p-3">
        <div class="w-24 h-20 rounded-xl overflow-hidden bg-brand-50 grid place-items-center flex-shrink-0">
          ${photo?`<img src="${esc(photo)}" class="w-full h-full object-cover">`:'<i class="fas fa-map text-brand-200 text-xl"></i>'}
        </div>
        <div class="text-sm">
          <b class="text-brand-900 font-head">${esc(s.type)} — ${esc(s.colony||s.location)}</b>
          <div class="text-slate-500 text-xs mt-0.5">${esc(s.location)}</div>
          <div class="text-slate-600 mt-1">${s.size_sqyd?s.size_sqyd+' sq ft · ':''}${s.rate_lakh?'₹'+s.rate_lakh+' Lakh':'Price on request'}</div>
        </div></div>`
    }

    $('#form-track').addEventListener('submit', async e => {
      e.preventDefault()
      const box = $('#result')
      const mobile = e.target.mobile.value.trim(), ref = e.target.ref.value.trim().replace(/\D/g,'')
      box.innerHTML = '<div class="text-center text-slate-400 py-8"><i class="fas fa-circle-notch fa-spin mr-2"></i>Checking…</div>'
      try {
        const res = await fetch(`/api/track?mobile=${encodeURIComponent(mobile)}&ref=${encodeURIComponent(ref)}`)
        const d = await res.json()
        if (!res.ok) throw new Error(d.error || 'Not found')
        const r = d.requirement
        box.innerHTML = `
          <div class="bg-white rounded-3xl shadow-sm border border-brand-100 p-5 sm:p-6">
            <div class="flex flex-wrap items-center gap-2 mb-1">
              <b class="font-head text-lg text-brand-900">Hello ${esc(r.name)} ji</b>
              <span class="text-xs bg-brand-50 text-brand-700 rounded-full px-3 py-1 font-semibold">#REQ-${r.id}</span>
            </div>
            <p class="text-sm text-slate-500 mb-6">${esc(r.type)} in <b>${esc(r.location)}</b> · Budget ₹${r.budget_min_lakh??'?'}–${r.budget_max_lakh??'?'} Lakh${r.timeline?' · '+esc(r.timeline):''}</p>
            ${statusTracker(r.status)}
          </div>
          <div class="mt-6">
            <h3 class="font-head font-bold text-brand-900 mb-3"><i class="fas fa-paper-plane text-brand-500 mr-2"></i>Properties Sent to You (${d.matches.length})</h3>
            ${d.matches.length ? `<div class="space-y-3">${d.matches.map(matchCard).join('')}</div>`
              : '<div class="bg-white rounded-2xl border border-brand-100 p-6 text-center text-slate-400 text-sm">No properties sent yet — our team is working on matching your requirement. We\'ll contact you soon.</div>'}
          </div>`
      } catch (err) {
        box.innerHTML = `<div class="bg-red-50 border border-red-200 text-red-600 rounded-2xl p-4 text-center text-sm">${esc(err.message)}</div>`
      }
    })
  </script>
</body>
</html>
