<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plot CRM Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<link rel="apple-touch-icon" href="logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plot CRM">
<style>
  :root{
    --bg:#f4f5f9; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --faint:#94a3b8;
    --line:#e7e9f2; --brand:#4f46e5; --brand2:#6366f1; --accent:#4f46e5;
    --side1:#111827; --side2:#1f2937;
    --ok:#15803d; --wa:#22c55e; --danger:#dc2626; --amber:#b45309;
    /* layered soft shadows = subtle 3D depth */
    --sh:0 1px 2px rgba(15,23,42,.05),0 3px 10px -2px rgba(15,23,42,.07);
    --sh-lg:0 2px 6px rgba(15,23,42,.06),0 16px 38px -12px rgba(15,23,42,.2);
    --hl:inset 0 1px 0 rgba(255,255,255,.9);
    --r:16px; --side:272px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background-color:var(--bg);
    background:
      radial-gradient(1100px 440px at 50% -150px,#e6e8fb 0%,rgba(230,232,251,0) 72%),
      linear-gradient(180deg,#edf0f8 0%,var(--bg) 360px,var(--bg) 100%);
    background-attachment:fixed;color:var(--ink);overflow-x:hidden;
    font-family:'Inter',-apple-system,'Segoe UI',system-ui,Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;letter-spacing:-.005em}
  .hdr-actions{flex:none}
  .brand h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  svg{width:20px;height:20px;flex-shrink:0}

  /* ── responsive shell ── */
  .shell{display:flex;flex-direction:column;min-height:100dvh}

  /* SIDE (mobile = top header, desktop = left sidebar) */
  .side{background:linear-gradient(165deg,var(--side1),var(--side2));color:#fff;
    position:sticky;top:0;z-index:20;padding:14px 16px 16px;box-shadow:0 4px 20px rgba(17,24,39,.25)}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;
    border:1px solid rgba(255,255,255,.25)}
  .brand-logo{height:42px;width:auto;max-width:150px;background:#fff;border-radius:10px;padding:5px 9px;flex-shrink:0}
  .brand h1{margin:0;font-size:1.15rem;font-weight:800;letter-spacing:-.01em}
  .brand .sub{font-size:.75rem;opacity:.82;margin-top:1px}
  .iconbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
    color:#fff;border-radius:10px;padding:8px;display:flex;cursor:pointer;transition:.12s}
  .iconbtn:active{transform:scale(.94)}

  .nav{display:flex;background:rgba(255,255,255,.12);border-radius:12px;padding:4px;margin-top:14px}
  .nav-item{flex:1;border:none;background:none;padding:9px;border-radius:9px;font-weight:700;
    font-size:.88rem;color:rgba(255,255,255,.85);cursor:pointer;display:flex;align-items:center;
    justify-content:center;gap:6px;transition:.15s}
  .nav-item.on{background:#fff;color:var(--brand);box-shadow:var(--sh)}
  .nav-item .dot{background:var(--danger);color:#fff;font-size:.66rem;font-weight:800;
    min-width:18px;height:18px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}

  .side-foot{margin-top:14px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);
    border-radius:12px;padding:9px 8px;text-align:center;cursor:pointer;transition:background .15s}
  .stat:active{background:rgba(255,255,255,.24)}
  .stat .n{font-size:1.35rem;font-weight:800;line-height:1.1}
  .stat .t{font-size:.66rem;opacity:.85;margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
  .side .side-add,.side .import-d,.side .export-d,.side .logout-d{display:none}
  .hdr-actions{margin-left:auto;display:flex;gap:8px}

  /* login screen */
  .login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;
    background:linear-gradient(165deg,var(--side1),var(--side2))}
  .login-card{background:#fff;border-radius:18px;box-shadow:var(--sh-lg);padding:30px 26px;width:100%;max-width:380px;text-align:center}
  .login-card .logo-lg{width:56px;height:56px;border-radius:15px;background:var(--brand);color:#fff;
    font-weight:800;font-size:1.6rem;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .login-logo{width:230px;max-width:80%;height:auto;display:block;margin:0 auto 18px}
  .login-card h1{margin:0 0 2px;font-size:1.3rem;font-weight:800}
  .login-card>p{color:var(--muted);font-size:.86rem;margin:0 0 20px}
  .login-card .field{text-align:left}
  .lg-err{color:var(--danger);font-size:.8rem;min-height:18px;margin:2px 0 8px;text-align:left}

  /* MAIN */
  .main{flex:1;min-width:0}
  .main-inner{max-width:1120px;margin:0 auto;padding:16px 18px calc(148px + env(safe-area-inset-bottom))}
  .page-title{display:none}

  @media(min-width:1000px){
    body{font-size:15px}
    .shell{flex-direction:row}
    .side{width:var(--side);height:100dvh;padding:22px 16px;display:flex;flex-direction:column;
      overflow-y:auto;box-shadow:2px 0 24px rgba(18,50,91,.12)}
    .brand h1{font-size:1.25rem}
    .nav{flex-direction:column;background:none;padding:0;gap:4px;margin-top:22px}
    .nav-item{justify-content:flex-start;padding:12px 14px;border-radius:11px;font-size:.95rem}
    .nav-item.on{background:var(--brand);color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.45)}
    .nav .nav-item svg{display:inline-block}   /* desktop sidebar shows icons */
    .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
    .stats{grid-template-columns:1fr 1fr}
    .side .hdr-actions{display:none}
    .side .side-add{display:flex;width:100%}
    .side .import-d,.side .export-d{display:flex}
    .side .logout-d{display:flex;width:100%}
    .main-inner{padding:26px 34px 60px}
    .page-title{display:block;font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
    .page-sub{display:block;color:var(--muted);font-size:.9rem;margin-bottom:18px}
    .fab{display:none!important}
  }

  /* ── form controls ── */
  input,select,textarea,button{font-family:inherit;font-size:.92rem}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);
    border-radius:11px;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(37,99,235,.13)}
  ::placeholder{color:var(--faint)}
  label{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.03em;display:block;margin:0 0 5px}
  .field{margin-bottom:13px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .execchecks{display:flex;flex-wrap:wrap;gap:8px}
  .chk{display:inline-flex;align-items:center;gap:7px;background:#f4f5f8;border:1px solid var(--line);
    border-radius:9px;padding:8px 11px;font-size:.85rem;font-weight:600;cursor:pointer}
  .chk input{width:auto;margin:0;accent-color:var(--brand)}
  .chk:has(input:checked){background:#eef0fc;border-color:var(--brand);color:var(--brand)}

  .search-wrap{position:relative}
  .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
  .search-wrap input{padding-left:40px}

  .btn{border:none;border-radius:11px;padding:12px 16px;font-weight:700;cursor:pointer;
    background:linear-gradient(180deg,#5a51ea,var(--brand));color:#fff;transition:.15s;display:inline-flex;align-items:center;
    justify-content:center;gap:7px;box-shadow:0 2px 8px -2px rgba(79,70,229,.5),inset 0 1px 0 rgba(255,255,255,.22)}
  .btn:hover{box-shadow:0 4px 14px -3px rgba(79,70,229,.55),inset 0 1px 0 rgba(255,255,255,.22)}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:linear-gradient(180deg,#fff,#f8f9fd);color:var(--brand);border:1.5px solid var(--line);box-shadow:var(--sh)}
  .btn.light{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.25)}
  .btn.sm{padding:9px 13px;font-size:.83rem}
  .btn.wide{width:100%}
  .btn.call{background:var(--ok)} .btn.wa{background:var(--wa)}
  .btn.danger{background:#fff;color:var(--danger);border:1.5px solid #fca5a5}

  .row{display:flex;gap:9px;align-items:center}
  .grow{flex:1;min-width:0}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  .tiny{font-size:.74rem;color:var(--muted)}
  .ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .card{background:linear-gradient(180deg,#ffffff,#fbfcff);border-radius:var(--r);box-shadow:var(--sh),var(--hl);border:1px solid var(--line)}

  /* reminder banner */
  .rem{display:flex;align-items:center;gap:13px;background:linear-gradient(100deg,#fff7ed,#fff);
    border:1px solid #fed7aa;border-left:4px solid var(--amber);border-radius:var(--r);
    padding:13px 15px;margin-bottom:16px;cursor:pointer;box-shadow:var(--sh)}
  .rem:active{transform:scale(.995)}
  .rem-ic{width:40px;height:40px;border-radius:11px;background:#fef3c7;color:var(--amber);
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .rem b{font-size:.95rem} .rem .go{color:var(--amber);font-weight:800;font-size:.85rem;display:flex;align-items:center;gap:3px}

  /* urgent reminders */
  .alert{display:flex;align-items:center;gap:12px;background:#fef2f2;border:1px solid #fecaca;
    border-left:4px solid var(--danger);border-radius:14px;padding:14px 16px;margin-bottom:16px}
  .alert .a-ic{width:40px;height:40px;border-radius:11px;background:#fee2e2;color:var(--danger);
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .alert b{color:var(--danger);font-size:.98rem}
  .lead.urgent{border-color:#fecaca;border-left:4px solid var(--danger);background:#fff7f7}
  .stat.stat-alert{background:rgba(220,38,38,.24);border-color:rgba(248,113,113,.55)}
  .stat.stat-alert .n{color:#fca5a5}
  .nav .nav-item svg{display:none}   /* mobile nav = text only, fits 4 tabs */

  /* leads list -> grid on desktop */
  .leads{display:flex;flex-direction:column;gap:9px}
  @media(min-width:1000px){ .leads{display:grid;grid-template-columns:1fr 1fr;gap:12px} }
  .lead{display:flex;align-items:center;gap:12px;padding:13px 15px;cursor:pointer;transition:.12s}
  .lead:active{background:#f8fafc}
  @media(min-width:1000px){ .lead:hover{box-shadow:var(--sh-lg);transform:translateY(-1px)} }

  /* table (desktop list view) */
  .leads-table{display:none;width:100%;border-collapse:separate;border-spacing:0;background:#fff;
    border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
  @media(min-width:1000px){ .leads-cards{display:none} .leads-table{display:table} }
  .leads-table th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;
    color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line);background:#fafbfc}
  .leads-table td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:.87rem}
  .leads-table tbody tr{cursor:pointer;transition:.1s}
  .leads-table tbody tr:hover{background:#f8fafc}
  .leads-table tbody tr:last-child td{border-bottom:none}
  .tbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px;display:inline-flex;cursor:pointer;color:var(--muted)}
  .tbtn svg{width:17px;height:17px}
  .tbtn.tcall{color:var(--ok)} .tbtn.twa{color:var(--wa)}
  .tbtn:active{transform:scale(.94)}

  /* pagination */
  .pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
  .psize,.pnav{display:flex;align-items:center;gap:6px}
  .pbtn{min-width:34px;height:34px;padding:0 9px;border:1px solid var(--line);background:#fff;
    border-radius:9px;font-weight:700;font-size:.82rem;color:var(--muted);cursor:pointer}
  .pbtn.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .pbtn:disabled{opacity:.4;cursor:default}

  /* kanban board */
  .kfilters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
  .kfilters .search-wrap{flex:1;min-width:170px}
  .kfilters select{width:auto;min-width:140px}
  .kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px}
  .kanban::-webkit-scrollbar{height:8px}
  .kanban::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
  .kcol{flex:0 0 270px;background:#eef1f5;border-radius:14px;padding:10px}
  .kcol.drop{outline:2px dashed var(--brand);outline-offset:-2px;background:#e6eafc}
  .kcol-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem;padding:4px 6px 12px}
  .kcol-h .cnt{margin-left:auto;background:#fff;color:var(--muted);font-size:.72rem;font-weight:800;
    padding:2px 9px;border-radius:20px;border:1px solid var(--line)}
  .dotc{width:9px;height:9px;border-radius:50%;display:inline-block}
  .kcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;box-shadow:var(--sh)}
  .kcard .kn{font-weight:700;font-size:.9rem;margin-bottom:2px}
  .kcard[draggable=true]{cursor:grab}
  .kcard.dragging{opacity:.4}
  .avatar{width:42px;height:42px;border-radius:12px;flex-shrink:0;color:#fff;font-weight:800;
    display:flex;align-items:center;justify-content:center;font-size:1rem}
  .chev{color:var(--faint)}
  .badge{font-size:.68rem;font-weight:800;padding:3px 9px;border-radius:8px;white-space:nowrap}
  .odot{width:7px;height:7px;border-radius:50%;background:var(--danger);flex-shrink:0;
    box-shadow:0 0 0 3px rgba(220,38,38,.15)}

  .scroll-x{display:flex;gap:8px;overflow-x:auto;padding:2px 0}
  .scroll-x::-webkit-scrollbar{display:none}
  .chip{font-size:.78rem;font-weight:700;padding:7px 13px;border-radius:20px;border:1.5px solid var(--line);
    background:linear-gradient(180deg,#fff,#f8f9fd);color:var(--muted);cursor:pointer;white-space:nowrap;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 2px 8px -2px rgba(79,70,229,.45)}

  .fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:30;
    background:var(--brand);color:#fff;border:none;border-radius:50px;padding:14px 24px;
    font-weight:800;font-size:.92rem;box-shadow:0 8px 24px rgba(79,70,229,.42);cursor:pointer;
    display:flex;align-items:center;gap:8px}
  .fab:active{transform:translateX(-50%) scale(.96)}

  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:120;display:flex;
    align-items:flex-end;justify-content:center;animation:fade .18s ease}
  .modal{background:#fff;width:100%;max-width:560px;max-height:93dvh;overflow-y:auto;
    border-radius:20px 20px 0 0;padding:8px 18px 28px;animation:up .22s cubic-bezier(.2,.8,.2,1)}
  @media(min-width:1000px){ .modal-bg{align-items:center} .modal{border-radius:20px;max-height:88dvh} }
  @keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(24px)}}
  .grab{width:38px;height:4px;background:var(--line);border-radius:3px;margin:8px auto 14px}
  @media(min-width:1000px){ .grab{display:none} .modal{padding-top:20px} }
  .modal h2{margin:0 0 4px;font-size:1.08rem;font-weight:800}
  .modal .msub{font-size:.78rem;color:var(--muted);margin-bottom:16px}
  /* WhatsApp message module */
  .wa-grid{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:760px){ .wa-grid{grid-template-columns:1fr 1fr} }
  .wa-card{border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:8px;cursor:pointer;transition:.12s;background:#fff}
  .wa-card:hover{border-color:var(--brand);box-shadow:var(--sh)}
  .wa-panel{background:#f7f8fa;border:1px solid var(--line);border-radius:12px;padding:12px}

  .detail-head{background:linear-gradient(135deg,var(--side1),var(--side2));color:#fff;
    padding:14px 18px;position:sticky;top:0;z-index:20;box-shadow:0 4px 20px rgba(17,24,39,.25)}
  .detail-head h1{margin:0;font-size:1.1rem;font-weight:800}
  .detail-head .sub{font-size:.75rem;opacity:.82}
  @media(min-width:1000px){
    .detail-head{background:#fff;color:var(--ink);box-shadow:inset 0 -1px 0 var(--line);position:static;padding:0 0 18px}
    .detail-head .iconbtn{background:#f1f5f9;border-color:var(--line);color:var(--ink)}
  }
  .detail-inner{max-width:820px;margin:0 auto}
  .sec{font-size:.72rem;font-weight:800;color:var(--faint);text-transform:uppercase;
    letter-spacing:.05em;margin:20px 2px 9px;display:flex;align-items:center;gap:8px}
  .kv{display:flex;gap:10px;font-size:.88rem;padding:8px 0;border-bottom:1px solid var(--line)}
  .kv:last-child{border-bottom:none}
  .kv b{color:var(--muted);font-weight:600;min-width:120px;font-size:.82rem}
  .fu-card{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:11px;background:#fff;box-shadow:var(--sh)}
  .fu-card .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
  .fu-line{font-size:.86rem;margin:4px 0}
  .fu-line b{color:var(--muted);font-weight:600}
  .att{display:inline-flex;align-items:center;gap:5px;background:#eef4ff;color:#1e40af;
    font-size:.72rem;font-weight:700;padding:4px 9px;border-radius:8px;margin:5px 5px 0 0}
  .arrow{color:var(--faint);font-weight:700}
  .empty{text-align:center;color:var(--muted);padding:52px 24px;font-size:.9rem}
  .empty svg{width:40px;height:40px;color:var(--faint);margin-bottom:10px}
  .grp-label{font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
    margin:20px 2px 9px;display:flex;align-items:center;gap:7px}
  a.plain{text-decoration:none;color:inherit;display:block}
  hr{border:none;border-top:1px solid var(--line);margin:14px 0}

  /* many tabs: mobile nav wraps to 2 rows (3 per row) — sab tabs dikhein, koi clip nahi */
  @media(max-width:999px){ .nav{flex-wrap:wrap;gap:4px} .nav-item{flex:1 1 28%;min-width:0;padding:9px 4px;font-size:.8rem;white-space:nowrap} }
  #_toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(18px);background:#111827;color:#fff;padding:11px 18px;
    border-radius:12px;font-weight:600;font-size:.88rem;box-shadow:var(--sh-lg);opacity:0;
    pointer-events:none;transition:.24s;z-index:130;max-width:88vw;text-align:center}
  #_toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* huddle cards */
  .hud-card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:16px 18px;margin-bottom:14px}
  .hud-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .hud-name{font-weight:800;font-size:1rem;line-height:1.2}
  .hud-blocks{display:grid;gap:10px}
  @media(min-width:720px){ .hud-blocks{grid-template-columns:1fr 1fr 1fr} }
  .hud-b{background:#f7f8fa;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  .hud-b.amber{background:#fff7ed;border-color:#fed7aa}
  .hud-b.empty{opacity:.45}
  .hud-lbl{display:block;font-size:.63rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:5px}
  .hud-b.amber .hud-lbl{color:var(--amber)}
  .hud-b .txt{font-size:.9rem;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .hud-fb{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .hud-fb-view{background:#eef0fc;border:1px solid #dfe3fb;border-radius:12px;padding:12px 14px}
  .hud-fb-view .hud-lbl{color:var(--brand)}

    .bn-item{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;

    .bn-item .bdot{position:absolute;top:0;left:52%;background:var(--danger);color:#fff;font-size:.54rem;font-weight:800;
      min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}
    .fab{bottom:calc(78px + env(safe-area-inset-bottom))!important}
  }

<body>
<div id="app"></div>

<script>
// DEMO MODE: in-memory stand-in for Firebase and the Apps Script backend. Sample data only; nothing leaves the browser.
// The real app code runs unchanged on top of this. The AI steps (Gemini, Sarvam) are simulated here and labelled as such.
(function(){
  const D = n => new Date(Date.now() + n*864e5).toISOString().slice(0,10);   // same day basis as the app's today()
  const uid = () => Math.random().toString(36).slice(2,10);
  const fu = (d, by, p, r, nd, na, prev, next) => ({ id: uid(), date: D(d), by, purpose: p, response: r, nextDate: nd == null ? '' : D(nd), nextAction: na, prev: prev||'', next: next||'' });
  const L = (id, name, mobile, colony, plot, status, src, exec, fus, extra) => Object.assign({ id, name, mobile, colony, plot, status, source: src, exec, execs:[exec], followUps: fus, need:{}, createdAt: D(-10), ts: Date.now() - id.charCodeAt(1)*60000 }, extra||{});
  const store = { leads: {
    a1: L('a1','Ramesh Sharma','9800000021','Gopal Vihar','A-14','hot','Telecaller','Amit',[fu(-1,'Amit','Price discussion','Interested, wants a corner plot',0,'Site visit call','warm','hot')],
      { budgetMin: 1800000, budgetMax: 2500000, ptype:'Plot', size:'1500 sq ft', loan:'yes', token:'yes', family:'Wife and two children; father decides with them',
        need:{ timeline:'Within 2 months', budget:'18-25 lakh', purpose:'Own house', ready:'Yes', remarks:'Wants east-facing corner', byName:'Amit', ts: Date.now()-2*864e5 },
        audit:{score:'5/6',checks:'intro✓ rapport✓ Q✓ req✓ tone✓ next✗',note:'Good call with real rapport. No visit date was fixed at the end.',issues:'Set a clear next step'}}),
    a2: L('a2','Sunita Verma','9700000008','Vinayak Residency','B-3','visit','Walk-in','Neha',[fu(-2,'Neha','Site visit','Liked the location, family visit on Sunday',1,'Family visit')]),
    a3: L('a3','Mohd. Irfan','9900000045','Dwarika Nagar','','warm','Hoarding/Ad','Amit',[fu(-3,'Amit','First call','Budget 8-10 lakh',-1,'Send layout on WhatsApp')]),
    a4: L('a4','Pooja Meena','9600000077','Gopal Vihar','C-9','booked','Reference','Neha',[fu(-5,'Neha','Booking','Token paid',5,'Registry documents')],{ deal:{ colony:'Gopal Vihar', plots:[{ no:'C-9', value:2150000 }], total: 2150000, count: 1, by:'demo@plotcrm.app', ts: Date.now()-5*864e5 } }),
    a5: L('a5','Vikram Singh','9400000019','Vinayak Residency','','fresh','Agent','Rohit',[],{agent:'Demo Agent'}),
    a6: L('a6','Kavita Jain','9300000062','Dwarika Nagar','D-2','hot','Telecaller','Amit',[fu(0,'Amit','Follow-up','Comparing two plots',0,'Call back at 5 PM')]),
    a7: L('a7','Suresh Nagar','9500000030','Gopal Vihar','','warm','Walk-in','Amit',[fu(-16,'Amit','Visit','Will decide after Diwali',-12,'Call after the festival')]),
    a8: L('a8','Anil Gupta','9200000054','Vinayak Residency','','lost','Hoarding/Ad','Neha',[fu(-8,'Neha','Call','Bought elsewhere',null,'')]),
    a9: L('a9','Deepak Rathore','9100000088','Dwarika Nagar','','fresh','Telecaller','Rohit',[]),
    b1: L('b1','Meena Devi','9000000015','Gopal Vihar','','nurture','Reference','Amit',[fu(-20,'Amit','Call','Interested next year',-11,'Share new offers')]),
    b2: L('b2','Harish Patel','9000000016','Vinayak Residency','','visit','Telecaller','Pooja',[fu(-1,'Pooja','Site visit','Visited with brother, liked plot 12',0,'Price call today')]),
    b3: L('b3','R. Sharma','9800000021','Gopal Vihar','','fresh','Telecaller','Neha',[],{ createdAt: D(-1) }),   // same number as a1: shows the merge tool
  }};

  const T0 = Date.now();
  store.config = { engage: { quotes:['Every follow-up is a new chance.','Listen to the customer and the customer will listen to you.'], stories:['One executive sent something useful every day for a week. On day eight the customer came for a site visit on their own.'], birthdays:[{ name:'Neha', date:'1990-'+D(0).slice(5) }] } };
  store.wall = {
    w1: { text:'3 site visits at Gopal Vihar today and 1 token received! 🎉', byName:'Neha', by:'neha@demo', ts: T0-2*3600e3, reactions:{ '👏':['amit@demo','rohit@demo'], '🔥':['pooja@demo'] }, comments:[{ name:'Amit', text:'Congratulations!', ts:T0-3000e3 }] },
    w2: { text:'The new brochure is in the team folder.', byName:'Amit', by:'amit@demo', ts: T0-26*3600e3, reactions:{ '👍':['neha@demo'] }, comments:[] }
  };

  (function(){ // this week's attendance + standups for the score board, same document ids as the app
    const dt = new Date(D(0)+'T00:00:00Z'), dow = (dt.getUTCDay()+6)%7, days = [];
    for (let i = 0; i <= Math.min(dow,5); i++) { const d = new Date(dt); d.setUTCDate(dt.getUTCDate()-dow+i); days.push(d.toISOString().slice(0,10)); }
    if (!days.includes(D(0))) days.push(D(0));
    store.attendance = {}; store.standups = {};
    const ppl = { amit:[1,1,1], neha:[1,1,0], rohit:[1,0,0], pooja:[0,1,1], sanjay:[1,1,1] };
    const work = [['5 follow-up calls','1 site visit'],['Send layouts to 3 new leads','Call back Kavita Jain'],['Visit Gopal Vihar with Harish Patel','Update the price sheet']];
    days.forEach((day, di) => Object.entries(ppl).forEach(([k, [a, p, r]], pi) => {
      const name = k[0].toUpperCase() + k.slice(1), isToday = day === D(0);
      if ((di + pi) % 4 === 3 && !(isToday && k === 'amit')) return;
      if (a) store.attendance[day+'__'+k] = { date: day, name, nameKey: k, inTime: '09:5'+pi, office:'kota', officeName:'Kota', ts: T0 };
      if (p) store.standups[day+'__'+k] = { date: day, name, nameKey: k, tasks: work[(di+pi)%3].map(t => ({ t, st: r && !isToday ? 'done' : '', rm:'' })), issues: [], ts: T0 };
    }));
  })();

  window.demoParseLead = function(text){
    // Stand-in for the Gemini step in the real app: simple pattern matching, clearly labelled.
    const t = String(text), r = {};
    const m = t.replace(/\s+/g,'').match(/[6-9]\d{9}/); if (m) r.mobile = m[0];
    const n = t.match(/^\s*([A-Z][a-z]+(?:\s[A-Z][a-z]+)?)/); if (n) r.name = n[1];
    const b = t.match(/(\d+)\s*-\s*(\d+)\s*lakh/i); if (b) { r.budgetMin = +b[1]*100000; r.budgetMax = +b[2]*100000; }
    const c = t.match(/\b(Jhalawar|Kota|Baran|Khanpur)\b/i); if (c) { r.city = c[1]; r.locations = c[1]; }
    if (/plot/i.test(t)) r.ptype = 'Plot';
    const sz = t.match(/(\d+\s*bigha|\d+x\d+)/i); if (sz) r.size = sz[1];
    if (/loan/i.test(t)) r.loan = 'yes';
    r.status = /(urgent|soon|hot)/i.test(t) ? 'hot' : 'warm';
    return new Promise(res => setTimeout(() => res(r), 700));
  };

  /* ---------- Saathi: simulated agent brain ----------
     The real server sends the chat to Gemini with 14 tool schemas; Gemini picks tools, the browser runs them on live
     data, and the loop repeats until Gemini replies. Here a small rule-based planner picks the same tools, so the real
     tool code in the app runs on the sample data. ponytail: keyword intents only; good enough to show the loop. */
  const LAST = a => a[a.length-1];
  const firstName = s => String(s||'').split(' ')[0];
  const calls = list => ({ toolCalls: list.map(([name, args], i) => ({ id: 'call_' + uid() + i, name, args: JSON.stringify(args||{}) })) });
  const say = reply => { try { if (window.speechSynthesis) { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(reply); u.lang = 'en-IN'; speechSynthesis.speak(u); } } catch (e) {} return { reply, audio: '' }; };
  const leadByName = text => Object.values(store.leads).filter(l => l.status !== 'deleted').find(l => new RegExp('\\b' + firstName(l.name).replace('.', '\\.') + '\\b', 'i').test(text));
  const list = (xs, f) => xs.slice(0, 4).map(f).join('; ');
  function nextDateFrom(t){ const days = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
    const k = days.findIndex(d => t.includes(d)); if (k < 0) return D(t.includes('today') ? 0 : 1);
    const now = new Date(); let add = (k - now.getUTCDay() + 7) % 7 || 7; return D(add); }

  function plan(msgs){
    const users = msgs.filter(m => m.role === 'user'), u = LAST(users) || { content: '' }, text = String(u.content).toLowerCase();
    const prevA = [...msgs].reverse().find(m => m.role === 'assistant' && m.content);
    const asked = prevA ? String(prevA.content) : '';
    if (u.hide || /^hello\. \(context/i.test(u.content)) return say(/evening/i.test(u.content)
      ? "Good evening Amit. Shall I take today's report? I can also check leads, follow-ups or the funnel."
      : "Good morning Amit. What's the plan for today? I can also check who is due for a follow-up or what the pipeline looks like.");
    if (/what are you planning today/i.test(asked) && !/\?$/.test(text)) {
      const tasks = u.content.split(/,|\band\b|\n/).map(s => s.trim()).filter(s => s.length > 2);
      return calls([['save_plan', { tasks }]]);
    }
    if (/how did each one go/i.test(asked)) {
      const st = text.includes('all done') ? 'done' : '';
      const parts = u.content.split(/,|\n/).map(s => s.trim());
      const tasks = (window.__saathiTasks || []).map((t, i) => { const p = (parts[i] || '').toLowerCase();
        return { t, st: st || (/done|complete|finished|yes/.test(p) ? 'done' : /pending|not|no\b/.test(p) ? 'pending' : 'partial'), rm: parts[i] || '' }; });
      const done = tasks.filter(t => t.st === 'done').length;
      return calls([['save_report', { tasks, feedback: done === tasks.length ? 'Everything done today. Great work.' : 'Good progress. Carry the pending items into tomorrow\'s plan.', score: Math.round(10 * (done + 0.5 * tasks.filter(t => t.st === 'partial').length) / Math.max(1, tasks.length)) }]]);
    }
    const lead = leadByName(u.content);
    if (/\b(log|add|note)\b.*follow/.test(text) && lead) {
      const note = (u.content.split(':')[1] || 'Spoke to the customer').trim();
      return calls([['add_followup', { leadId: lead.id, note, nextDate: nextDateFrom(text), nextAction: 'Call back' }]]);
    }
    if (/plan/.test(text)) return say("Sure. What are you planning today? List the tasks separated by commas.");
    if (/report/.test(text)) return calls([['today_standup', {}]]);
    if (/due|follow/.test(text)) return calls([['list_leads', { kind: 'due_today' }]]);
    if (/overdue/.test(text)) return calls([['list_leads', { kind: 'overdue' }]]);
    if (/cold/.test(text)) return calls([['list_leads', { kind: 'going_cold' }]]);
    if (/\bhot\b/.test(text)) return calls([['list_leads', { kind: 'hot' }]]);
    if (/pipeline|funnel|value|won/.test(text)) return calls([['funnel_summary', {}]]);
    if (/score|week/.test(text)) return calls([['member_report', {}]]);
    if (/attendance|punch/.test(text)) return calls([['attendance', { name: /team|everyone|all/.test(text) ? 'all' : '' }]]);
    if (/team/.test(text)) return calls([['team_stats', {}]]);
    if (lead) return calls([['search_leads', { query: firstName(lead.name) }]]);
    return say("I can help with leads, follow-ups, the funnel, attendance and your daily plan or report. Try one of the suggestions below.");
  }

  function answer(msgs){
    // tool results since the last assistant(tool_calls) message
    const ai = msgs.map(m => m.role).lastIndexOf('assistant'), a = msgs[ai], res = {};
    (a.tool_calls || []).forEach(tc => { const t = msgs.slice(ai + 1).find(m => m.tool_call_id === tc.id); try { res[tc.function.name] = JSON.parse(t.content); } catch (e) { res[tc.function.name] = {}; } });
    const [name] = Object.keys(res), r = res[name] || {};
    if (r.error) return say('Sorry, ' + r.error + '.');
    if (r.cancelled) return say('Okay, nothing saved. What should I change?');
    if (name === 'search_leads') { const x = r.results || []; if (x.length === 1) return calls([['lead_detail', { id: x[0].id }]]);
      return say(x.length ? `I found ${x.length} matches: ${list(x, l => l.name + ' in ' + l.colony)}.` : 'No lead found with that name.'); }
    if (name === 'lead_detail') { const l = r.lead, f = (l.followUps || [])[0];
      return say(`${l.name} is a ${l.status} lead for ${l.colony || 'an open colony'}, handled by ${l.owner}.` + (l.need ? ` Need analysis: ${l.need.purpose}, budget ${l.need.budget}, timeline ${l.need.timeline.toLowerCase()}.` : '') + (f ? ` Last follow-up on ${f.date}: ${f.baat}.` : '') + (l.next ? ` Next follow-up ${l.next}.` : '')); }
    if (name === 'list_leads') { const x = r.leads || [], k = { due_today: 'due for a follow-up today', overdue: 'overdue', going_cold: 'going cold', hot: 'hot', new: 'new' }[r.kind];
      if (!x.length) return say(`No leads are ${k} right now.`);
      return say(`${x.length} lead${x.length > 1 ? 's are' : ' is'} ${k}: ${list(x, l => l.name + (r.kind === 'going_cold' ? ', quiet for ' + l.coldDays + ' days' : ' (' + l.status + ')'))}. Want me to log a follow-up for one of them?`); }
    if (name === 'funnel_summary') return say(`The weighted pipeline is ${r.funnelValue.replace('₹', 'rupees ')} across ${r.openLeads} open leads. ${r.stages.filter(s => s.count).map(s => s.count + ' ' + s.stage).join(', ')}. Won so far: ${r.wonDeals} deal${r.wonDeals === 1 ? '' : 's'} worth ${r.wonValue.replace('₹', 'rupees ')}.`);
    if (name === 'today_standup') { const t = (r.tasks || []).map(x => x.t); window.__saathiTasks = t;
      if (!t.length) return say("You have no plan for today yet. Tell me what you worked on and I'll save it.");
      return say(`Today's plan had ${t.length} tasks: ${t.map((x, i) => (i + 1) + ') ' + x).join(', ')}. How did each one go? For example: done, pending.`); }
    if (name === 'save_plan') return say(`Saved. Today's plan now has ${r.totalTasks} task${r.totalTasks === 1 ? '' : 's'}. I'll take your report this evening.`);
    if (name === 'save_report') return say(`Report saved with ${r.totalTasks} tasks updated. Thanks Amit, see you tomorrow.`);
    if (name === 'add_followup') return say(`Done. The follow-up for ${r.lead} is logged.`);
    if (name === 'member_report') { const d = (r.last7 || []).filter(x => !x.leave);
      return say(`Your weekly score is ${r.weekScore} out of ${r.weekMax}. In the last 7 days you punched in ${d.filter(x => x.att).length} times and filled ${d.filter(x => x.report).length} full reports.`); }
    if (name === 'attendance') return r.present ? say(`${r.present.length} people punched in today` + (r.notMarked && r.notMarked.length ? `, and ${r.notMarked.length} have not marked attendance yet.` : '.'))
      : say(r.punchedIn ? `You punched in at ${r.in}${r.late ? ', marked late' : ''}.` : 'You have not punched in today.');
    if (name === 'team_stats') return say((r.members || []).slice(0, 4).map(m => `${m.owner}: ${m.open} open, ${m.hot} hot, ${m.overdue} overdue`).join('. ') + '.');
    return say('Done.');
  }

  window.demoJsonp = function(url){
    const q = new URL(url.replace(/^demo:\/\/exec/, 'https://demo.invalid/exec')).searchParams;
    const wait = (v, ms) => new Promise(res => setTimeout(() => res(v), ms));
    if (q.get('agentTurn')) { let msgs = []; try { msgs = JSON.parse(q.get('msgs') || '[]'); } catch (e) {}
      const last = LAST(msgs) || {};
      return wait(last.role === 'tool' ? answer(msgs) : plan(msgs), 650); }
    if (q.get('parseLead')) return window.demoParseLead(q.get('parseLead'));
    if (q.get('audit')) return wait({ score: '4/6', intro: 1, rapport: 1, questions: 1, requirement: 1, tone: 0, nextstep: 0, note: 'Clear introduction and good questions. The tone was rushed and no next step was agreed.', issues: 'Slow down; fix a visit date' }, 1200);
    return wait({ recUrl: '' }, 200);
  };
  // Voice in Saathi: the real app records audio for Sarvam speech-to-text; the demo uses the browser's own speech recognition.
  window.addEventListener('load', () => {
    if (location.hash === '#saathi') setTimeout(() => { try { openAgent('plan', true); } catch (e) {} }, 1200);   // portfolio link opens Saathi directly
    window.agMicToggle = function(){
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { try { toast('Voice needs Chrome or Edge in this demo. Type instead.'); } catch (e) {} return; }
      const r = new SR(); r.lang = 'en-IN'; const b = document.getElementById('ag_mic'); if (b) b.textContent = '⏹';
      r.onresult = e => { const i = document.getElementById('ag_text'); if (i) { i.value = e.results[0][0].transcript; agTextSend(); } };
      r.onend = () => { if (b) b.textContent = '🎤'; };
      r.onerror = () => { try { toast('Microphone not available. Type instead.'); } catch (e) {} };
      r.start();
    };
  });

  const listeners = {};
  const clone = o => JSON.parse(JSON.stringify(o));
  const coll = n => (store[n] = store[n] || {});
  const notify = n => (listeners[n] || []).forEach(l => l());
  function snap(n, filters, order){
    let arr = Object.entries(coll(n)).map(([id, v]) => ({ id, v }));
    filters.forEach(([f, op, val]) => { arr = arr.filter(x => op === '==' ? x.v[f] === val : op === 'in' ? val.includes(x.v[f]) : op === '>=' ? x.v[f] >= val : op === '<=' ? x.v[f] <= val : true); });
    if (order) arr.sort((a, b) => (a.v[order] > b.v[order] ? 1 : -1));
    const docs = arr.map(x => ({ id: x.id, exists: true, data: () => clone(x.v), ref: docRef(n, x.id) }));
    return { empty: !docs.length, size: docs.length, docs, forEach: f => docs.forEach(f) };
  }
  function docRef(n, id){ id = id || uid(); const c = coll(n); return {
    id,
    get: () => Promise.resolve({ id, exists: !!c[id], data: () => c[id] ? clone(c[id]) : undefined }),
    set: (d, o) => { c[id] = (o && o.merge && c[id]) ? Object.assign(c[id], clone(d)) : clone(d); setTimeout(() => notify(n)); return Promise.resolve(); },
    update: d => { c[id] = Object.assign(c[id] || {}, clone(d)); setTimeout(() => notify(n)); return Promise.resolve(); },
    delete: () => { delete c[id]; setTimeout(() => notify(n)); return Promise.resolve(); },
    onSnapshot: cb => { const l = () => cb({ id, exists: !!c[id], data: () => clone(c[id]) }); (listeners[n] = listeners[n] || []).push(l); setTimeout(l); return () => {}; }
  }; }
  function query(n, filters, order){ const q = {
    where: (f, op, v) => query(n, filters.concat([[f, op, v]]), order),
    orderBy: f => query(n, filters, f), limit: () => q,
    get: () => Promise.resolve(snap(n, filters, order)),
    onSnapshot: cb => { const l = () => cb(snap(n, filters, order)); (listeners[n] = listeners[n] || []).push(l); setTimeout(l); return () => {}; },
    doc: id => docRef(n, id),
    add: d => { const r = docRef(n); return r.set(d).then(() => r); }
  }; return q; }
  const user = { uid:'demo', email:'demo@plotcrm.app', displayName:'Demo Manager', getIdToken: () => Promise.resolve('demo') };
  const auth = { currentUser: user, onAuthStateChanged: cb => { setTimeout(() => cb(user), 30); return () => {}; }, signOut: () => Promise.resolve(), signInWithEmailAndPassword: () => Promise.resolve(), sendPasswordResetEmail: () => Promise.resolve() };
  const db = { enablePersistence: () => Promise.resolve(), collection: n => query(n, [], null),
    batch: () => { const ops = []; return { set: (r, d, o) => ops.push(() => r.set(d, o)), update: (r, d) => ops.push(() => r.update(d)), delete: r => ops.push(() => r.delete()), commit: () => { ops.forEach(f => f()); return Promise.resolve(); } }; } };
  const fs = () => db; fs.FieldValue = { serverTimestamp: () => Date.now(), arrayUnion: (...a) => a, arrayRemove: () => [], increment: n => n, delete: () => null };
  window.firebase = { initializeApp(){}, apps:[1], auth: () => auth, firestore: fs, messaging(){ throw new Error('demo'); } };
  // Outside calls (Cloudinary upload, notify API, Sheet mirror) are switched off in the demo.
  const realFetch = window.fetch.bind(window);

const lastFU = L => L.followUps && L.followUps.length ? L.followUps[0] : null;
const execsOf = L => (Array.isArray(L.execs)&&L.execs.length) ? L.execs : (L.exec ? [L.exec] : []);
const execStr = L => execsOf(L).join(', ') || '—';
const ownerOf = L => execsOf(L)[0] || '—';                 // main executive = owner
const assignedExtra = L => execsOf(L).slice(1);            // owner ke alawa assigned
function avatarColor(name){ let h=0; for(const c of name) h=c.charCodeAt(0)+((h<<5)-h);
  return `hsl(${Math.abs(h)%360},50%,42%)`; }
const uniq = arr => [...new Set(arr.filter(Boolean))].sort();
function badge(k){ const s=stMap[k]||stMap.fresh;
  return `<span class="badge" style="background:${s.bg};color:${s.c}">${s.l}</span>`; }
// Due date = follow-up ki next-date; agar wo nahi to customer ki "contact after" date. (Lost/Won pe koi reminder nahi.)
const dueDate = L => { if(!OPEN.includes(L.status)) return ''; const fu=lastFU(L); return (fu&&fu.nextDate) ? fu.nextDate : (L.contactAfter||''); };
const isDue = L => { const d=dueDate(L); return d && d<=today(); };
const isOverdue = L => { const d=dueDate(L); return d && d<today(); };
// Naya = assigned par koi kaam nahi + koi contact-after date bhi nahi (contact-after wale due-date flow me aate hain)
const isNew = L => OPEN.includes(L.status) && !(L.followUps && L.followUps.length) && !L.contactAfter;
const needsAction = L => isNew(L) || isDue(L);                                        // pending = naya ya due
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
// Lead ka "last update" time — nayi lead ya jisme koi naya kaam (follow-up/edit/status) hua, wo upar.
function _idTime(id){ return (id&&/^id\d/.test(id))? (parseInt(id.slice(2,15),10)||0) : 0; }
function leadTime(L){
  if(!L) return 0;
  let t = L.ts || _idTime(L.id) || (L.createdAt? new Date(L.createdAt+'T00:00').getTime() : 0);
  (L.followUps||[]).forEach(fu=>{ const ft=_idTime(fu.id) || (fu.date? new Date(fu.date+'T00:00').getTime():0); if(ft>t) t=ft; });
  return t;
}

// ── Going cold: OPEN lead jiska koi future next-step nahi + N din se chup (idea: HeyPuter CRM) ──
const COLD_DAYS = 14;
function lastContact(L){ let d=L.createdAt||''; (L.followUps||[]).forEach(fu=>{ if(fu.date&&fu.date>d)d=fu.date; }); return d; }
function coldDays(L){ const d=lastContact(L); if(!d) return 0; return Math.max(0,Math.round((Date.now()-new Date(d+'T00:00').getTime())/864e5)); }
const isCold = L => { if(!OPEN.includes(L.status)) return false; const due=dueDate(L); if(due&&due>today()) return false; return coldDays(L)>=COLD_DAYS; };

function filtered(){
  const out = leads.filter(L=>{
    if(f.cold && !isCold(L)) return false;
    if(f.status && L.status!==f.status) return false;
    if(f.colony && L.colony!==f.colony) return false;
    if(f.exec && !execsOf(L).includes(f.exec)) return false;
    if(f.q){ const q=f.q.toLowerCase();
      if(!(L.name.toLowerCase().includes(q)||L.mobile.includes(f.q)||(L.plot||'').toLowerCase().includes(q))) return false; }
    const d = (lastFU(L)?.date)||L.createdAt||'';
    if(f.from && d < f.from) return false;
    if(f.to && d > f.to) return false;
    return true;
  });
  if(f.cold) return out.sort((a,b)=>coldDays(b)-coldDays(a));   // sabse zyada chup wali upar
  return out.sort((a,b)=>leadTime(b)-leadTime(a));              // nayi add ki hui lead sabse upar
}

async function colonyMerge(){

  const picked=[...document.querySelectorAll('.colchk:checked')].map(c=>c.value).filter(c=>c!==canon);
  if(!picked.length){ alert('Tick at least one colony to merge'); return; }
  const affected=leads.filter(L=>picked.includes((L.colony||'').trim()));
  if(!affected.length){ alert('No leads in these colonies.'); return; }
  if(!confirm(affected.length+' leads will be merged into "'+canon+'". Continue?\n('+picked.length+' names → 1)')) return;
  try{

    affected.forEach(L=>batch.update(col().doc(L.id),{colony:canon}));
    await batch.commit();
    toast(affected.length+' leads merged ✓');
    const m=document.querySelector('.modal-bg'); if(m)m.remove();

async function leadMergeGroup(phone){
  const grp=leads.filter(L=>digits(L.mobile)===phone);
  if(grp.length<2) return;
  grp.sort((a,b)=>((b.followUps||[]).length)-((a.followUps||[]).length) || (_idTime(a.id)-_idTime(b.id)));  // zyada FU / purani = keeper
  const keep=grp[0], rest=grp.slice(1);
  if(!confirm(phone+' has '+grp.length+' leads. Merge all into "'+keep.name+'"?\n(The others go to the Deleted bin and can be restored.)')) return;
  const fus=[...(keep.followUps||[])], seen=new Set(fus.map(x=>x.id));
  rest.forEach(L=>(L.followUps||[]).forEach(fu=>{ if(!seen.has(fu.id)){ fus.push(fu); seen.add(fu.id); } }));
  fus.sort((a,b)=>(_idTime(b.id)||0)-(_idTime(a.id)||0));
  keep.followUps=fus;
  keep.execs=[...new Set([...execsOf(keep), ...rest.flatMap(execsOf)])]; keep.exec=keep.execs[0]||keep.exec;
  keep.status=grp.map(L=>L.status).sort((a,b)=>(stMap[b]?.p||0)-(stMap[a]?.p||0))[0];   // best stage
  rest.forEach(L=>{ if(!keep.lineOfAction&&L.lineOfAction)keep.lineOfAction=L.lineOfAction;
    if((!keep.need||!Object.keys(keep.need).length)&&L.need&&Object.keys(L.need).length)keep.need=L.need;
    if(!keep.deal&&L.deal)keep.deal=L.deal;
    ['colony','plot','city','occupation','contactAfter','family','refBy'].forEach(k=>{ if(!keep[k]&&L[k])keep[k]=L[k]; }); });
  keep.ts=Date.now();
  try{
    await putLead(keep);
    const batch=db.batch();
    rest.forEach(L=>batch.set(col().doc(L.id),{deleted:true,deletedBy:(user&&user.email||''),deletedAt:Date.now(),mergedInto:keep.id},{merge:true}));
    await batch.commit();
    toast(rest.length+' lead merge ho gaye ✓');
    const m=document.querySelector('.modal-bg'); if(m)m.remove(); render();
  }catch(e){ alert('Merge fail: '+e.message); }
}

async function agMicToggle(){

  if(_ag.rec && _ag.rec.state==='recording'){ _ag.rec.stop(); return; }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    _ag.stream=stream; _ag.chunks=[];
    const mr=new MediaRecorder(stream); _ag.rec=mr;
    mr.ondataavailable=e=>{ if(e.data&&e.data.size) _ag.chunks.push(e.data); };
    mr.onstop=async()=>{ try{ stream.getTracks().forEach(t=>t.stop()); }catch(e){}
      const b=document.getElementById('ag_mic'); if(b)b.textContent='🎤';
      const blob=new Blob(_ag.chunks,{type:(_ag.chunks[0]&&_ag.chunks[0].type)||'audio/webm'});
      _agMic(true); _agStatus('Listening…');
      const url=await uploadBlob(blob,'agent_'+Date.now()+'.webm');
      if(!url){ _agMic(false); _agStatus('Upload failed. Please speak again.'); return; }
      agSend(url);
    };

async function agSend(audioUrl){
  if(!_ag) return; _ag.busy=true; _agMic(true); _agStatus(audioUrl?'Listening…':'Saathi is thinking…');
  // ponytail: history GET URL me jaati hai — ~12KB se lambi ho to purane msgs hatao (shuru user msg se hi ho). Lambi chats chahiye to POST pe le jaana.
  while(_ag.msgs.length>2 && encodeURIComponent(JSON.stringify(_ag.msgs)).length>12000){ _ag.msgs.shift(); while(_ag.msgs.length>1&&_ag.msgs[0].role!=='user') _ag.msgs.shift(); }
  const url=AUDIT_URL+(AUDIT_URL.includes('?')?'&':'?')+'agentTurn=1&round='+(_ag.rounds||0)
    +'&msgs='+encodeURIComponent(JSON.stringify(_ag.msgs))
    +(audioUrl?'&audio='+encodeURIComponent(audioUrl):'');
  try{
    const r=await _jsonp(url);
    if(!_ag) return;
    if(!r||r.error){ _ag.busy=false; _agMic(false); _agStatus(''); _agSay('(problem: '+((r&&r.error)||'network')+')'); return; }
    if(r.transcript){ _agUser(r.transcript); _ag.msgs.push({role:'user',content:r.transcript}); }
    if(r.toolCalls && r.toolCalls.length){
      // assistant(tool_calls) message HUM banate hain (r.toolCalls se) — ids kabhi mismatch nahi honge
      _ag.msgs.push({role:'assistant',content:'',tool_calls:r.toolCalls.map(tc=>({id:tc.id,type:'function',function:{name:tc.name,arguments:tc.args||'{}'}}))});
      _agStatus('Checking the data…');
      for(const tc of r.toolCalls){
        let res; try{ res=await _agTool(tc.name, JSON.parse(tc.args||'{}')); }catch(e){ res={error:String(e&&e.message||e)}; }
        if(!_ag) return;   // open/create_lead ne modal band kar diya
        _ag.msgs.push({role:'tool',tool_call_id:tc.id,content:JSON.stringify(res).slice(0,2500)});
      }
      _ag.rounds=(_ag.rounds||0)+1;
      return agSend(null);   // loop: agent ko tool-results do
    }
    _ag.busy=false; _agMic(false); _agStatus('');
    _ag.msgs.push({role:'assistant',content:r.reply||''}); _ag.rounds=0; _agStore();
    _agSay(r.reply, r.audio);
  }catch(e){ if(_ag) _ag.busy=false; _agMic(false); _agStatus('Network error. Please try again.'); }
}

async function _agMergeTasks(inc){
  const name=_ag.name, date=today(), ref=db.collection('standups').doc(date+'__'+name.toLowerCase().replace(/[^a-z0-9]+/g,'-'));
  const snap=await ref.get(), cur=snap.exists?snap.data():{};

  const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9ऀ-ॿ]+/g,' ').trim();
  let added=0, updated=0;
  inc.forEach(n=>{ const k=norm(n.t);
    const ex=tasks.find(t=>{ const tk=norm(t.t); return tk===k || (k.length>3&&tk.length>3&&(tk.includes(k)||k.includes(tk))); });
    if(ex){ if(n.st&&ex.st!==n.st){ ex.st=n.st; updated++; } if(n.rm) ex.rm=n.rm; }

  return `<div class="main-inner" style="font-family:Inter,system-ui,Arial">
    <div class="row" style="align-items:center;gap:8px"><button class="btn ghost sm" onclick="tab('list')">← Back</button><h2 class="page-title" style="margin:0">Sales Funnel</h2></div>
    <div class="tiny" style="color:var(--muted);margin:2px 0 14px">Pipeline value · weighted by stage probability</div>
    <div class="grid2">
      <div><label class="tiny">Project (colony) · <a href="#" onclick="openColonyMgr();return false" style="color:var(--brand);font-weight:700">🏘️ fix dups</a></label><select onchange="fnSet('colony',this.value)"><option value="">All colonies</option>${colonies.map(c=>`<option ${fn.colony===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>

    </div>

// ── Date-wise Lead Report (kisne kaun si lead daali) ──
let _lrRange='today';
function _leadDate(L){
  if(L.createdAtSys) return new Date(L.createdAtSys+5.5*3600e3).toISOString().slice(0,10);  // system time (IST)
  if(L.createdAt) return String(L.createdAt).slice(0,10);
  if(L.ts) return new Date(L.ts+5.5*3600e3).toISOString().slice(0,10);
  return '';
}
function _lrDates(){
  const t=today();
  if(_lrRange==='today') return [t];
  if(_lrRange==='yest'){ const d=new Date(t+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()-1); return [d.toISOString().slice(0,10)]; }
  if(_lrRange==='week') return _weekDates(t);
  if(_lrRange==='lastweek'){ const d=new Date(t+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()-7); return _weekDates(d.toISOString().slice(0,10)); }
  return [t];
}
function leadReport(){ if(!isAdmin()){ alert('Admins only'); return; } _lrRange='today'; _lrRender(); }
function _lrRender(){
  const ex=document.querySelector('.modal-bg'); if(ex) ex.remove();
  const dates=new Set(_lrDates());
  const inRange=leads.filter(L=>dates.has(_leadDate(L)));
  const g={}; inRange.forEach(L=>{ const k=L.createdByName||(L.createdBy?L.createdBy.split('@')[0]:'Older lead'); (g[k]=g[k]||[]).push(L); });
  const names=Object.keys(g).sort((a,b)=>g[b].length-g[a].length);
  const chip=(k,l)=>`<button class="chip ${_lrRange===k?'on':''}" onclick="_lrRange='${k}';_lrRender()">${l}</button>`;
  const body=names.length? names.map(n=>`<div style="border-top:1px solid var(--line);padding:9px 0">
      <div class="row" style="justify-content:space-between;align-items:center"><b>${esc(n)}</b><span class="tiny" style="font-weight:800">${g[n].length}</span></div>
      ${g[n].map(L=>`<div class="tiny" style="color:var(--muted);padding:2px 0;cursor:pointer" onclick="this.closest('.modal-bg').remove();go('detail','${esc(L.id)}')">• ${esc(L.name||'—')}${L.mobile?' · '+esc(L.mobile):''}</div>`).join('')}
    </div>`).join('') : '<div class="tiny" style="padding:12px 0">No leads in this range.</div>';
  modal(`<h2>📋 Lead Report</h2><div class="msub">Who added which leads · Total ${inRange.length}</div>
    <div class="scroll-x" style="display:flex;gap:6px;margin-bottom:10px">${chip('today','Today')}${chip('yest','Yesterday')}${chip('week','This week')}${chip('lastweek','Last week')}</div>
    <div style="max-height:50vh;overflow:auto">${body}</div>
    <div class="row" style="margin-top:12px"><button class="btn ghost grow" onclick="this.closest('.modal-bg').remove()">Close</button></div>`);
}
function pageSlice(arr){
  const pages=Math.max(1,Math.ceil(arr.length/pageSize));
  if(page>pages) page=pages; if(page<1) page=1;
  return arr.slice((page-1)*pageSize, page*pageSize);
}

function kdrag(e,id,el){ dragId=id; el.classList.add('dragging'); e.dataTransfer.effectAllowed='move';

function kdrop(e,st){
  e.preventDefault();
  const id = dragId || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
  const L = leads.find(x=>x.id===id);
  if(L && L.status!==st){ const prev=L.status; L.status=st; L.ts=Date.now(); putLead(L); _wonCheck(L, prev); }   // stage move → upar aaye
  dragId=null; render();

async function saveLead(id){
  const name=val('l_name'), mobile=val('l_mobile');
  if(!name){ alert('Name is required'); return; }
  if(!mobile){ alert('Mobile is required'); return; }
  if(!id){   // nayi lead — same mobile pehle se ho to warn
    const dup=leads.find(L=>digits(L.mobile)&&digits(L.mobile)===digits(mobile));
    if(dup && !confirm('⚠ This number already belongs to "'+dup.name+'" ('+(stMap[dup.status]?.l||'')+' · '+execStr(dup)+'). Add a new lead anyway?')) return;
  }
  const main = val('l_exec');
  const extra = [...document.querySelectorAll('.l_extra:checked')].map(c=>c.value);
  const execs = [...new Set([main, ...extra].filter(Boolean))];   // main + assigned executives
  document.querySelectorAll('.modal .btn').forEach(b=>{ b.disabled=true; });   // upload ke dauraan double-submit rokna
  const rec = await uploadFile('l_rec');
  const photo = await uploadFile('l_photo');
  const bmin=parseInt(val('l_bmin'))||0, bmax=parseInt(val('l_bmax'))||0;
  if(bmin&&bmax&&bmin>bmax){ alert('Minimum budget cannot be more than the maximum'); document.querySelectorAll('.modal .btn').forEach(b=>{b.disabled=false;}); return; }
  const data={ name, mobile, occupation:val('l_occ'), city:val('l_city'),
    colony:val('l_colony'), plot:val('l_plot'), source:val('l_source'),
    agent:val('l_agent'), exec:execs[0]||'', execs, status:val('l_status'),
    createdAt: val('l_date')||today(),
    locations:(val('l_locations')||'').split(',').map(s=>s.trim()).filter(Boolean),
    ptype:val('l_ptype'), size:val('l_size'), budgetMin:bmin||'', budgetMax:bmax||'',
    cash:parseInt(val('l_cash'))||'', loan:val('l_loan'), loanAmt:parseInt(val('l_loanamt'))||'',
    loanStatus:val('l_loanstatus'), token:val('l_token'),
    family:val('l_family'), refBy:val('l_refby'), contactAfter:val('l_cafter') };
  let L, prevStatus='';
  if(id){
    if(rec) data.rec = rec; if(photo) data.photo = photo;   // edit → lead-level attachment
    L=leads.find(x=>x.id===id); prevStatus=L.status; Object.assign(L, data); L.ts=Date.now();
  } else {
    L={ id:uid(), ...data, createdBy:(user&&user.email||''), createdByName:_crmName(), createdAtSys:Date.now(), ts:Date.now(), need:{}, followUps:[] }; leads.unshift(L);
    // pehli baat-cheet ko first follow-up bana do (agar bhari ho)
    const g=i=>document.getElementById(i)?document.getElementById(i).value.trim():'';
    const p=g('l_purpose'), r=g('l_response'), nd=g('l_ndate'), na=g('l_naction');
    if(p||r||nd||na||rec||photo){
      L.followUps=[{ id:uid(), date:L.createdAt||today(), by:L.exec, purpose:p, response:r,
        nextDate:nd, nextAction:na, prev:L.status, next:L.status, rec, photo }];
    }
  }
  await putLead(L); const m=document.querySelector('.modal-bg'); if(m) m.remove();
  if(rec){ if(id) auditRec(L.id, rec, null);                       // edit → lead-level recording
           else if(L.followUps&&L.followUps[0]&&L.followUps[0].rec===rec) auditRec(L.id, rec, L.followUps[0].id); }  // nayi lead → pehle followup me
  if(!id){ notifyAssignees(L); go('detail', L.id); } else render();
  _wonCheck(L, prevStatus);
}
// lead add hote hi assigned executives ko INSTANT notification (Vercel server ke through)
async function notifyAssignees(L){
  try{
    const execs = execsOf(L);
    if(!execs.length || !user) return;
    const idToken = await user.getIdToken();
    await fetch(NOTIFY_URL, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+idToken },
      body: JSON.stringify({ execs, leadName: L.name })
    });
  }catch(e){ console.warn('instant notify failed', e); }

// ── IMPORT (bulk add from CSV) ───────────────────────────────────────────────
function importCSV(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.csv,text/csv';
  inp.onchange=()=>{ const file=inp.files[0]; if(!file) return;
    const r=new FileReader(); r.onload=()=>parseImport(String(r.result)); r.readAsText(file); };
  inp.click();
}
function parseCSV(text){                         // handles quoted fields, commas, newlines
  const rows=[]; let field='',row=[],inQ=false; text=text.replace(/\r\n?/g,'\n');
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; } else field+=c; }
    else if(c==='"') inQ=true;
    else if(c===',') { row.push(field); field=''; }
    else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
    else field+=c;
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows;
}
function parseImport(text){
  const rows=parseCSV(text).filter(r=>r.some(c=>c.trim()!==''));
  if(rows.length<2){ alert('CSV is empty or has no data rows.'); return; }
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const col=(...names)=>{ for(const n of names){ const i=head.indexOf(n); if(i>=0) return i; } return -1; };
  const ci={ name:col('name','contact'), mobile:col('mobile','phone','mobile number'),
    occupation:col('occupation','business'), city:col('city','city / address','address'),
    colony:col('colony','colony / plot'), plot:col('plot','preferred plot'),
    source:col('source','lead source'), agent:col('agent','agent name'),
    exec:col('executive','exec'), status:col('status') };
  if(ci.name<0||ci.mobile<0){ alert('CSV needs at least "Name" and "Mobile" columns.\nTip: use an Export file as your template.'); return; }
  const stByLabel=Object.fromEntries(STATUSES.map(s=>[s.l.toLowerCase(),s.k]));
  Object.assign(stByLabel,{fresh:'fresh',warm:'warm','site visit':'visit',sitevisit:'visit',booked:'booked',nurture:'nurture'}); // purane labels bhi chalein
  const seen=new Set(leads.map(L=>digits(L.mobile)));   // dedupe by mobile
  const batch=db.batch();                               // ponytail: single batch (Firestore limit 500 rows/import)
  let added=0, skipped=0;
  rows.slice(1).forEach(r=>{
    const g=i=>i>=0?(r[i]||'').trim():'';
    const name=g(ci.name), mob=g(ci.mobile);
    if(!name||!mob){ skipped++; return; }
    if(seen.has(digits(mob))){ skipped++; return; }
    seen.add(digits(mob));
    const L={ id:uid(), name, mobile:mob, occupation:g(ci.occupation), city:g(ci.city),
      colony:g(ci.colony), plot:g(ci.plot), source:g(ci.source)||'Other', agent:g(ci.agent),
      exec:g(ci.exec), status:stByLabel[g(ci.status).toLowerCase()]||'fresh',
      createdAt:today(), createdBy:(user&&user.email||''), createdByName:_crmName(), createdAtSys:Date.now(), need:{}, followUps:[] };
    leads.unshift(L); batch.set(col().doc(L.id), L); added++;
  });
  batch.commit().catch(e=>alert('Import save failed: '+e.message));
  page=1; render();
  alert(`Import complete — ${added} added, ${skipped} skipped (missing name/mobile or duplicate).`);
}

const pnPlugin = ()=> window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.PushNotifications;
async function regNative(name){
  const PushNotifications = pnPlugin();
  if(!PushNotifications){ alert('Push plugin missing. Install the latest APK.'); return; }
  try{
    const perm = await PushNotifications.requestPermissions();
    if(perm.receive!=='granted'){ alert('Notifications not allowed. Turn them on in phone settings.'); return; }
    if(!window._pnSetup){
      window._pnSetup = true;
      PushNotifications.addListener('registration', t=>{
        const nm = localStorage.getItem('myName')||'';
        db.collection('tokens').doc(t.value).set({ token:t.value, name:nm, nameKey:nm.toLowerCase(), email:user?user.email:'', platform:'android', ts:Date.now() });
      });
      PushNotifications.addListener('registrationError', e=>alert('Push error: '+JSON.stringify(e)));
      PushNotifications.addListener('pushNotificationReceived', ()=>updateBadge());
    }
    await PushNotifications.register();
    alert('Reminder notifications ON ✅ ('+name+')\nNotifications are now reliable!');
  }catch(e){ alert('Native push error: '+e.message); }

function stdIssues(s){ if(Array.isArray(s.issues)) return s.issues.map(x=>String(x==null?'':x)).filter(Boolean);
  if(typeof s.issues==='string'&&s.issues) return s.issues.split(/\n+/).map(x=>x.trim()).filter(Boolean); return []; }
function stdYesterday(s){ if(Array.isArray(s.yesterday)) return s.yesterday.map(x=>({t:x.t||'',st:x.st||'',rm:x.rm||'',proof:x.proof||'',proofUrl:x.proofUrl||''}));
  if(typeof s.yesterday==='string'&&s.yesterday) return s.yesterday.split(/\n+/).map(x=>x.trim()).filter(Boolean).map(t=>({t,st:'',rm:'',proof:'',proofUrl:''})); return []; }
function _blankTask(){ return {t:'',st:'',rm:'',proof:'',proofUrl:''}; }
function _isImg(u){ return /\.(jpe?g|png|gif|webp|bmp|heic|svg)(\?|$)/i.test(u) || /\/image\/upload\//.test(u); }
function blankDraft(){ return { date: today(), yesterday:[], tasks:[_blankTask(),_blankTask(),_blankTask()], issues:[''] }; }
// Kisi date ke liye form bharo: doc ho to load, warna Kal-ka-task pichhle standup se auto (carry-forward)
function hudFillDraftFor(date){
  hud.draft.date=date;
  const doc=hud.mine.find(s=>s.date===date);
  if(doc){ hud.draft.yesterday=stdYesterday(doc); hud.draft.tasks=stdTasks(doc); hud.draft.issues=stdIssues(doc); }
  else {
    hud.draft.yesterday=[]; hud.draft.tasks=[_blankTask(),_blankTask(),_blankTask()]; hud.draft.issues=[''];
    const lim=(()=>{const dt=new Date(date+'T00:00');dt.setDate(dt.getDate()-10);return dt.toISOString().slice(0,10);})();
    for(const s of hud.mine){ if(s.date>=date||s.date<lim) continue; const tks=stdTasks(s);
      if(tks.length){ hud.draft.yesterday=tks.map(t=>({t:t.t,st:'',rm:'',proof:'',proofUrl:''})); break; } }   // pichhle din ke task -> auto
  }
  if(!hud.draft.tasks.length) hud.draft.tasks=[_blankTask()];
  if(!hud.draft.issues.length) hud.draft.issues=[''];
}
let hud = { date: today(), items: [], mine: [], draft: blankDraft(), report:null, editing:false, execFilter:'' };

function hudSetMyName(n){ const e=(user&&user.email||'').toLowerCase(); if(e) localStorage.setItem('hudName_'+e, n); }

function toast(msg){ let t=document.getElementById('_toast');
  if(!t){ t=document.createElement('div'); t.id='_toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2200); }

// ── Report → WhatsApp (canvas image + text, koi library nahi) ──
function _reportCanvas(title, sub, rows){
  const W=760, pad=30, lh=32, head=100;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=head + rows.length*lh + pad*2;
  const x=cv.getContext('2d');
  x.fillStyle='#ffffff'; x.fillRect(0,0,cv.width,cv.height);
  x.fillStyle='#111827'; x.fillRect(0,0,W,head);
  x.fillStyle='#fff'; x.font='bold 27px Arial'; x.fillText(title,pad,44);
  x.fillStyle='#cbd5e1'; x.font='16px Arial'; x.fillText(sub,pad,76);
  let y=head+pad+6; x.font='18px Arial';
  rows.forEach(r=>{ x.fillStyle=r.c||'#111827'; x.font=(r.b?'bold ':'')+'18px Arial'; x.fillText((r.t||'').slice(0,70),pad+(r.pad||0),y); y+=lh; });
  return cv;
}
function shareReport(title, sub, rows, text){
  try{
    _reportCanvas(title,sub,rows).toBlob(async(blob)=>{
      const file=new File([blob],'report.png',{type:'image/png'});
      try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],text}); return; } }catch(_){}
      try{ if(navigator.share){ await navigator.share({text}); return; } }catch(_){}
      window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
    },'image/png');
  }catch(_){ window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank'); }
}
function attShareReport(){
  const byKey={}; att.items.forEach(a=>byKey[(a.nameKey||'').toLowerCase()]=a);
  const rows=[], lines=[]; let present=0,total=0;
  OFFICES.forEach(o=>{ const staff=OFFICE_STAFF[o.id]||[]; if(!staff.length) return;
    rows.push({t:o.name,b:true,c:'#4f46e5'}); lines.push('*'+o.name+'*');
    staff.forEach(nm=>{ total++; const a=byKey[nm.toLowerCase()]; if(a)present++;
      rows.push({t:(a?'✅ ':'❌ ')+nm+(a?'  '+a.inTime+(a.late?' (Late)':''):'  Absent'),pad:12,c:a?(a.late?'#b45309':'#047857'):'#b91c1c'});
      lines.push((a?'✅ ':'❌ ')+nm+(a?' '+a.inTime+(a.late?' (Late)':''):' — Absent')); });
  });
  const dt=fmtDate(att.date);
  const text='📋 *Attendance — '+dt+'*\n'+present+'/'+total+' present\n\n'+lines.join('\n')+'\n\n🙏 If you have not punched in, please do it in the app now.\n\n📲 Open attendance in the app';
  shareReport('Attendance — '+dt, present+'/'+total+' present', rows, text);
}
function hudShareReport(){
  const posted=hud.items.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const pk=new Set(posted.map(x=>(x.nameKey||(x.name||'').toLowerCase())));
  const missing=EXECS.filter(n=>!pk.has(n.toLowerCase()));
  const rows=[], lines=[]; const mk=st=>st==='done'?'✅':st==='partial'?'🟡':st==='notdone'?'❌':'•';
  posted.forEach(s=>{ rows.push({t:(s.name||'?'),b:true}); lines.push('*'+(s.name||'?')+'*');
    stdTasks(s).forEach(t=>{ rows.push({t:mk(t.st)+' '+t.t+(t.proof?' ('+t.proof+')':''),pad:12}); lines.push(mk(t.st)+' '+t.t+(t.proof?' — '+t.proof:'')); });
  });
  if(missing.length){ rows.push({t:'Pending: '+missing.join(', '),c:'#b91c1c'}); }
  const dt=fmtDate(hud.date);
  const text='📋 *Daily Huddle — '+dt+'*\n\n'+lines.join('\n')+(missing.length?'\n\n⏳ *Pending standup:* '+missing.join(', ')+'\n🙏 Please fill in your standup.':'')+'\n\n📲 Open the huddle in the app';
  shareReport('Daily Huddle — '+dt, posted.length+' posted'+(missing.length?' · '+missing.length+' pending':''), rows, text);
}

function hudEdit(id){ const s=hud.mine.find(x=>x.id===id); if(!s) return;
  hud.draft={ date:s.date, yesterday:stdYesterday(s), tasks:stdTasks(s), issues:stdIssues(s) };

function hudAddTask(){ hud.draft.tasks.push(_blankTask()); render(); }

function hudDelete(id){ if(!confirm('Delete this standup?')) return;
  db.collection('standups').doc(id).delete().then(()=>{ toast('Deleted'); hudLoad(); }).catch(e=>alert(e.message)); }
function hudSetDate(d){ hud.date=d; hudLoad(); }

async function hudLoad(){
  const mine=hudMyName().toLowerCase();
  try{
    if(mine){ const s=await db.collection('standups').where('nameKey','==',mine).get();
      hud.mine=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.date||'').localeCompare(a.date||'')); }
    else hud.mine=[];
    // Form bharo: is date ka doc ho to load, warna "Kal kya kiya" pichhle din se auto-fill
    if(!hud.editing) hudFillDraftFor(hud.draft.date);
    if(canViewAllHA()){ const s=await db.collection('standups').where('date','==',hud.date).get();
      hud.items=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||'')); }
  }catch(e){ alert('Huddle load error: '+e.message); }
  if(route.view==='huddle') render();
}

async function hudSaveStandup(){
  const name=hudMyName();
  if(!name){ alert('Choose your name first'); hudPickName(); return; }
  const date=hud.draft.date||today();
  // proof file ho to Cloudinary pe upload, phir array banao
  const build=async(arr,prefix)=>{ const out=[];
    for(let i=0;i<arr.length;i++){ const x=arr[i]; const t=(x.t||'').trim(); if(!t) continue;
      let proofUrl=x.proofUrl||'';
      const fin=document.getElementById(prefix+i);
      if(fin && fin.files && fin.files[0]){ const u=await uploadFile(prefix+i); if(u) proofUrl=u; }
      out.push({t,st:x.st||'',rm:(x.rm||'').trim(),proof:(x.proof||'').trim(),proofUrl});
    } return out; };
  const yesterday=await build(hud.draft.yesterday,'yfile');
  const tasks=await build(hud.draft.tasks,'tfile');
  const issues=hud.draft.issues.map(x=>(x||'').trim()).filter(Boolean);
  if(!tasks.length && !issues.length && !yesterday.length){ alert('Fill in something: yesterday’s work, today’s tasks or an issue'); return; }
  const id=date+'__'+name.toLowerCase().replace(/[^a-z0-9]+/g,'-');
  db.collection('standups').doc(id).set({ date, name, nameKey:name.toLowerCase(), yesterday, tasks, issues, ts:Date.now() }, {merge:true})
    .then(()=>{ pushHuddleSheet({date, name, yesterday, tasks, issues}); toast(hud.editing?'Standup updated ✓':'Standup saved ✓'); hud.editing=false; hudLoad(); })
    .catch(e=>alert('Save failed: '+e.message));
}
function hudFeedback(id){
  const el=document.getElementById('fb_'+id); if(!el) return;
  db.collection('standups').doc(id).set({ feedback:(el.value||'').trim(),
      feedbackBy:(user&&user.email?user.email.split('@')[0]:''), feedbackTs:Date.now() }, {merge:true})
    .then(()=>{ toast('Feedback saved ✓'); hudLoad(); })
    .catch(e=>alert(e.message));
}

let board = { date: today(), std:[], att:[], award:{} };
function openBoard(){ route.view='board'; route.id=null; board.date=today(); board.std=[]; board.att=[]; render(); boardLoad(); window.scrollTo(0,0); }
function boardShiftDay(n){ const dt=new Date(board.date+'T00:00:00Z'); dt.setUTCDate(dt.getUTCDate()+n); board.date=dt.toISOString().slice(0,10); boardLoad(); }
// hafte ke 6 din (Mon–Sat) — UTC me (stored date keys bhi UTC-based hain)
function _weekDates(dateStr){ const dt=new Date(dateStr+'T00:00:00Z'); const dow=(dt.getUTCDay()+6)%7;
  const out=[]; for(let i=0;i<6;i++){ const d=new Date(dt); d.setUTCDate(dt.getUTCDate()-dow+i); out.push(d.toISOString().slice(0,10)); } return out; }
// ek din ka score: attendance(1) + day plan(1=task bhara) + day report(1=sab task ka status bhara)
function _dayScore(key,day){
  const att = board.att.some(a=>(a.nameKey||'')===key && a.date===day && a.inTime) ? 1 : 0;
  const s = board.std.find(x=>(x.nameKey||'')===key && x.date===day);
  const tasks = (s && Array.isArray(s.tasks)) ? s.tasks : [];
  const plan = tasks.length>0 ? 1 : 0;
  const report = (tasks.length>0 && tasks.every(t=>t.st)) ? 1 : 0;
  return { att, plan, report, total: att+plan+report };
}
function _isLeave(key,day){ return board.att.some(a=>(a.nameKey||'')===key && a.date===day && a.leave && !a.inTime); }
// weekly: leave din ko baaki (non-leave) dino ka average milta hai → total = avg × 6
function _weekScore(key){
  const days=_weekDates(board.date); let sum=0, worked=0;
  days.forEach(d=>{ if(_isLeave(key,d)) return; sum+=_dayScore(key,d).total; worked++; });
  if(worked===0) return 0;
  return Math.round((sum/worked)*6);
}
async function boardLoad(){

  }catch(e){ alert('Board load error: '+e.message); }

}

function distM(la1,lo1,la2,lo2){ const R=6371000, r=x=>x*Math.PI/180;
  const dLa=r(la2-la1), dLo=r(lo2-lo1);
  const x=Math.sin(dLa/2)**2 + Math.cos(r(la1))*Math.cos(r(la2))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(x)); }
function getPos(){
  const G = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Geolocation;
  if(isNative() && G){                        // APK: native Geolocation plugin (sahi runtime permission)
    return (async ()=>{
      const perm = await G.requestPermissions().catch(()=>null);
      if(perm && perm.location==='denied') throw new Error('Allow location: Settings → Apps → Plot CRM → Permissions → Location');
      const p = await G.getCurrentPosition({ enableHighAccuracy:true, timeout:15000 });
      return { latitude:p.coords.latitude, longitude:p.coords.longitude, accuracy:p.coords.accuracy };
    })();
  }
  return new Promise((res,rej)=>{             // browser (Chrome): web geolocation
    if(!navigator.geolocation) return rej(new Error('This device has no GPS'));
    navigator.geolocation.getCurrentPosition(p=>res(p.coords),
      e=>rej(new Error(e.code===1?'Location permission is needed. Tap "Allow"':(e.message||'Location not found'))),
      {enableHighAccuracy:true, timeout:15000, maximumAge:0});
  });
}

  if(!Object.keys(att.offices).length) await attLoadOffices();
  // kisi bhi office pe punch — bas us office ke andar hona zaroori (nearest office check)
  const targets = OFFICES.map(o=>({o, cfg:att.offices[o.id]})).filter(x=>x.cfg && x.cfg.lat!=null);
  if(!targets.length){ alert('No office location is set yet.\nAsk an admin to tap "Set location" at the office.'); return; }
  let c; try{ c=await getPos(); }catch(e){ alert('Location error: '+e.message+'\n\nTurn on location and allow this site.'); return; }
  let best=null;
  for(const {o,cfg} of targets){ const d=distM(c.latitude,c.longitude,cfg.lat,cfg.lng); if(!best||d<best.d) best={o,d}; }
  if(best.d>OFFICE_RADIUS){ alert(`You are not near any office.\nNearest: ${best.o.name} (~${Math.round(best.d)} m away). Punch in once you are inside the office.`); return; }
  const t=istTime(), late=t>LATE_AFTER, date=today();
  try{
    await db.collection('attendance').doc(attId(date,name)).set({ date, name, nameKey:name.toLowerCase(),
      office:best.o.id, officeName:best.o.name, inTime:t, inLat:c.latitude, inLng:c.longitude,
      inDist:Math.round(best.d), late, ts:Date.now() }, {merge:true});
    toast(late?('Punch-in ✓ '+t+' (Late)') : ('Punch-in ✓ '+t)); attLoad();
  }catch(e){ alert('Save error: '+e.message); }
}

let wall = { posts:[], cfg:null, todayOpens:0 };
function _dayIdx(){ return Math.floor((Date.now()+5.5*3600e3)/864e5); }   // IST din number (rotation ke liye)
function quoteOfDay(){ const q=(wall.cfg&&wall.cfg.quotes)||[]; return q.length?q[_dayIdx()%q.length]:''; }
function storyOfDay(){ const s=(wall.cfg&&wall.cfg.stories)||[]; return s.length?s[_dayIdx()%s.length]:''; }
function todaysBirthdays(){ const b=(wall.cfg&&wall.cfg.birthdays)||[]; const md=new Date(Date.now()+5.5*3600e3).toISOString().slice(5,10); return b.filter(x=>(x.date||'').slice(-5)===md); }
function _ago(ts){ if(!ts) return ''; const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'now'; if(s<3600) return Math.floor(s/60)+'m'; if(s<86400) return Math.floor(s/3600)+'h'; return Math.floor(s/86400)+'d'; }
async function logAppOpen(){
  if(!user||!user.email) return;
  try{ await db.collection('applogs').doc(user.email+'__'+today()).set({ email:user.email, date:today(),
    count:firebase.firestore.FieldValue.increment(1), ts:Date.now() },{merge:true}); }catch(_){}

async function engageLoad(){
  try{
    const [cf,ws]=await Promise.all([
      db.collection('config').doc('engage').get(),
      db.collection('wall').orderBy('ts','desc').limit(40).get()
    ]);
    wall.cfg=cf.exists?(cf.data()||{}):{quotes:[],stories:[],birthdays:[]};
    wall.posts=ws.docs.map(d=>({id:d.id,...d.data()}));
    if(canViewAllHA()){ const u=await db.collection('applogs').where('date','==',today()).get();
      wall.todayOpens=u.docs.reduce((s,d)=>s+((d.data().count)||0),0); }
  }catch(_){}
  if(route.view==='wall'||route.view==='home') render();
}

      byName:hudMyName()||((user&&user.email||'').split('@')[0]), ts:Date.now() });

async function wallDelete(id){ if(!confirm('Delete this post?')) return;
  try{ await db.collection('wall').doc(id).delete(); toast('Deleted'); engageLoad(); }catch(e){ alert(e.message); } }
async function wallReact(id, emoji){
  if(!user) return;
  const key=(user.email||'').replace(/[^a-z0-9]/gi,'_');
  const post=wall.posts.find(p=>p.id===id); if(!post) return;
  const reacts=Object.assign({}, post.reacts||{});
  if(reacts[key]===emoji) delete reacts[key]; else reacts[key]=emoji;
  post.reacts=reacts; render();                         // optimistic
  try{ await db.collection('wall').doc(id).update({ reacts }); }catch(e){ engageLoad(); }
}
async function wallComment(id){

    ${st?`<div class="card" style="padding:12px;border-left:3px solid #10b981;margin-top:12px"><div class="tiny" style="font-weight:800;color:#10b981">📖 STORY OF THE DAY</div><div style="margin-top:4px;white-space:pre-wrap">${esc(st)}</div></div>`:''}
    <div class="sec" style="margin-top:18px"><span class="grow">📣 Wall</span><button class="btn ghost sm" onclick="openWall()">See all</button></div>
    ${peek.length? peek.map(p=>`<div class="card" style="padding:12px;margin-bottom:10px" onclick="openWall()">
        <div class="row" style="gap:10px;align-items:center">${avH(p.byName||p.by,30)}<div class="grow" style="min-width:0"><b>${esc(p.byName||p.by||'?')}</b><div class="tiny" style="color:var(--muted)">${_ago(p.ts)}</div></div></div>
        ${p.text?`<div style="margin-top:6px;white-space:pre-wrap">${esc(p.text.length>140?p.text.slice(0,140)+'…':p.text)}</div>`:''}
        ${p.img?`<img src="${esc(p.img)}" loading="lazy" style="max-width:100%;border-radius:10px;margin-top:8px">`:''}
      </div>`).join('') : `<div class="card" style="padding:14px;text-align:center"><div class="tiny" style="color:var(--muted)">No posts yet. <a href="#" onclick="openWall();return false" style="color:var(--brand);font-weight:700">Be the first to post</a> 🎉</div></div>`}
  </div>`;
}
