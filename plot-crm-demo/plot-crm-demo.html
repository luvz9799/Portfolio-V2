// ════ Birthday manager (per-user add) ════
let _bd=[];
function _mdLabel(md){ const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; const p=(md||'').split('-'); return p.length===2?(parseInt(p[1],10)+' '+(mo[parseInt(p[0],10)-1]||'')):md; }
function openBirthdays(){ _bd=(((wall.cfg&&wall.cfg.birthdays)||[]).map(b=>({name:b.name,date:b.date,type:b.type}))); _bdRender(); }
function _bdRender(){
  const ex=document.querySelector('.modal-bg'); if(ex) ex.remove();
  const list=_bd.length? _bd.map((b,i)=>`<div class="row" style="justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)">
      <span>${b.type==='anniv'?'💍':'🎂'} <b>${esc(b.name)}</b> · ${_mdLabel(b.date)}</span>
      <button class="iconbtn" style="background:#f1f5f9;color:#b91c1c;padding:5px 9px" onclick="_bdDel(${i})">✕</button></div>`).join('') : '<div class="tiny" style="padding:6px 0">None yet. Add one below.</div>';
  modal(`<h2>🎂 Birthdays / Anniversaries</h2><div class="msub">Add one per user</div>
    <div style="max-height:38vh;overflow:auto;margin-bottom:12px">${list}</div>
    <div class="field">${execSelect('bd_name','')}</div>
    <div class="row" style="gap:8px">
      <input id="bd_date" type="date" style="flex:1">
      <select id="bd_type" style="flex:none;width:auto"><option value="birthday">🎂 Birthday</option><option value="anniv">💍 Anniversary</option></select>
    </div>
    <button class="btn ghost sm" style="margin-top:8px" onclick="_bdAdd()">${IC.add} Add</button>
    <div class="row" style="gap:11px;margin-top:16px"><button class="btn ghost grow" onclick="this.closest('.modal-bg').remove()">Close</button>
    <button class="btn grow" onclick="_bdSave()">Save all</button></div>`);
}
function _bdAdd(){ const n=val('bd_name'), d=val('bd_date'), t=val('bd_type');
  if(!n||!d){ alert('Name and date are both required'); return; }
  _bd.push({ name:n, date:d.slice(5), type:t }); _bdRender(); }
function _bdDel(i){ _bd.splice(i,1); _bdRender(); }
function _bdSave(){ db.collection('config').doc('engage').set({ birthdays:_bd },{merge:true})
  .then(()=>{ const m=document.querySelector('.modal-bg'); if(m)m.remove(); toast('Saved ✓'); engageLoad(); })
  .catch(e=>alert('Not saved: '+e.message)); }
function bottomNavHTML(){
  if(!user) return '';
  // active = kaunse views us tab ke andar aate hain (groups)
  const nav=(views,icon,label,onclick,badge)=>`<button class="bn-item ${views.includes(route.view)?'on':''}" onclick="${onclick}">${badge?`<span class="bdot">${badge}</span>`:''}${icon}<span>${label}</span></button>`;
  if(isHuddleOnly()) return `<nav class="bottomnav">
    ${nav(['home'],IC.home,'Home','openHome()','')}
    ${nav(['huddle','team'],IC.inbox,'Huddle','openHuddle()','')}
    ${nav(['att','board'],IC.check,'Attend.','openAtt()','')}
    ${nav(['wall'],IC.wall,'Wall','openWall()','')}
    <button class="bn-item" onclick="openMore()">${IC.menu}<span>More</span></button>
  </nav>`;
  const pending=leads.filter(isOverdue).length+leads.filter(isNew).length;
  return `<nav class="bottomnav">
    ${nav(['home','today'],IC.home,'Home','openHome()','')}
    ${nav(['list','kanban','reminders','detail'],IC.users,'Leads',"tab('list')",pending||'')}
    ${nav(['team','huddle','att','board'],IC.team,'Team','openTeam()','')}
    ${nav(['wall'],IC.wall,'Wall','openWall()','')}
    <button class="bn-item" onclick="openMore()">${IC.menu}<span>More</span></button>
  </nav>`;
}

function render(){
  if(!user){ renderLogin(); return; }
  if(isHuddleOnly() && !['huddle','att','help','wall','home','team'].includes(route.view)) route.view='huddle';   // huddle-only: Home/Team/Huddle/Attendance/Wall/Help
  const content = route.view==='detail' ? detailHTML() :
                  route.view==='home' ? homeHTML() :
                  route.view==='team' ? teamHTML() :
                  route.view==='funnel' ? funnelHTML() :
                  route.view==='att' ? attView() :
                  route.view==='board' ? boardHTML() :
                  route.view==='wall' ? wallHTML() :
                  route.view==='huddle' ? huddleHTML() :
                  route.view==='forms' ? formsHTML() :
                  route.view==='help' ? helpHTML() :
                  route.view==='kanban' ? kanbanHTML() :
                  route.view==='reminders' ? remindersHTML() :
                  route.view==='today' ? todayHTML() : listHTML();
  const updBanner = apkUpdateAvailable() ? `<div onclick="openUpdate()" style="background:#f59e0b;color:#fff;padding:11px 16px;font-weight:700;font-size:.86rem;display:flex;align-items:center;gap:8px;cursor:pointer">${IC.download}<span>New app update (${esc(_apkLatest.versionName)}) — tap to update</span></div>` : '';
  document.getElementById('app').innerHTML = `<div class="shell">${sideHTML()}<main class="main">${updBanner}${content}</main></div>${bottomNavHTML()}`;
}
// ── Back button: galti se poora app exit na ho ──
// Modal khula ho to band; detail/dusre tab par ho to Home; Home par double-back = exit.
// ── In-app APK update (native only) — version.json check + 1-tap download ──
let _apkLatest=null;
function apkUpdateAvailable(){ return isNative() && _apkLatest && _apkLatest.versionName && _apkLatest.versionName!==localStorage.getItem('apkVer'); }
async function apkCheck(){
  if(!isNative()) return;
  try{ const r=await fetch('version.json?cb='+Date.now(),{cache:'no-store'}); _apkLatest=await r.json();
    if(apkUpdateAvailable()) render(); }catch(_){}
}
function _apkAbsUrl(u){ if(!u) return ''; if(/^https?:/.test(u)) return u; return location.origin+location.pathname.replace(/[^/]*$/,'')+u; }
function openUpdate(){
  const go=v=>{
    if(!v||!v.url){ toast('Update info not found (version.json)'); return; }
    if(!confirm('New app version: '+(v.versionName||'')+(v.note?'\n\n'+v.note:'')+'\n\nDownload now? Then tap the file or notification and choose "Install".')) return;
    window.open(_apkAbsUrl(v.url),'_blank');
    if(v.versionName) localStorage.setItem('apkVer', v.versionName);
    render();
  };
  if(_apkLatest) go(_apkLatest);
  else fetch('version.json?cb='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(go).catch(()=>toast('Update check failed. Check your connection'));
}
let _backReady=false;
// true = app ke andar hi handle ho gaya (ruko); false = bahar jaane do (exit)
function handleBack(){
  const fo=document.getElementById('formOverlay'); if(fo){ fo.remove(); return true; }   // form overlay band
  const m=document.querySelector('.modal-bg'); if(m){ m.remove(); return true; }   // modal band
  if(route.view==='detail'){ tab('list'); return true; }                            // detail -> list
  const home = isHuddleOnly() ? 'huddle' : 'today';
  if(user && route.view!==home){ tab(home); return true; }                          // dusra tab -> Home
  // Home par: quit confirmation (general apps jaisa) — OK = band, Cancel = ruko
  return !confirm('Close the app?');
}
// Remote-URL APK par Capacitor.Plugins.App populate nahi hota — registerPlugin se proxy lo
function _capApp(){
  try{
    if(!window.Capacitor) return null;
    if(Capacitor.Plugins && Capacitor.Plugins.App) return Capacitor.Plugins.App;
    if(Capacitor.registerPlugin) return Capacitor.registerPlugin('App');
  }catch(_){}
  return null;
}
function setupBackHandler(){
  if(_backReady) return; _backReady=true;
  // 1) Capacitor APK: hardware/gesture back (app band hone se rokta hai)
  try{
    const A=_capApp();
    if(A && A.addListener){
      A.addListener('backButton', ()=>{
        if(!handleBack()){ try{ A.exitApp(); }catch(_){} }   // sirf Home par confirm ke baad exit
      });
    }
  }catch(_){}
  // 2) Browser / PWA: history guard (popstate)
  try{ history.pushState({p:'app'},''); }catch(_){}
  window.addEventListener('popstate', ()=>{
    if(handleBack()){ try{ history.pushState({p:'app'},''); }catch(_){} }  // ruke to state wapas
  });
}
document.getElementById('app').innerHTML = '<div class="login"><div class="login-card">Loading…</div></div>';
// deep-link: shared WhatsApp link (#att/#huddle/#board/#wall) se seedha us section pe
function _deepOpen(hv){
  if(hv==='att') openAtt();
  else if(hv==='huddle') openHuddle();
  else if(hv==='board'){ if(canViewAllHA()) openBoard(); }
  else if(hv==='wall') openWall();
}
auth.onAuthStateChanged(u=>{
  user=u;
  if(u){
    setupBackHandler(); apkCheck(); logAppOpen(); engageLoad();
    const hv=(location.hash||'').replace('#','').toLowerCase();   // deep-link: #att / #huddle / #board / #wall
    if(isHuddleOnly()){ leads=[]; attLoadOffices();
      if(hv==='att') openAtt(); else if(hv==='wall') openWall(); else { route.view='huddle'; render(); hudLoad(); }
      return; }
    attLoadOffices();
    if(!unsub){
      unsub = col().onSnapshot(snap=>{
        const all = snap.docs.map(d=>{ const L={id:d.id, ...d.data()};
          if(!Array.isArray(L.followUps)) L.followUps=[]; if(!L.need) L.need={}; return L; });
        deletedLeads = all.filter(L=>L.deleted);     // bin
        leads = all.filter(L=>!L.deleted);           // active (sab jagah yahi use hota)
        render(); updateBadge();
      }, err=>{ alert('Data load error: '+err.message); });
    }
    _deepOpen(hv);   // link se seedha us section pe
  } else {
    if(unsub){ unsub(); unsub=null; }
    leads=[]; renderLogin();
  }
});

// PWA — register service worker (offline + installable)
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> Promise.reject().then(r=>{swReg=r;}).catch(()=>{}));
}
// native app: high-importance channel (sound + heads-up notification)
window.addEventListener('load', ()=>{ setTimeout(()=>{ try{
  const PN=pnPlugin();
  if(PN) PN.createChannel({ id:'reminders', name:'Reminders', description:'Lead reminders', importance:5, sound:'default', vibration:true, visibility:1 });
}catch(_){}}, 1500); });
